<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision Guard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>Vision Guard</h1>
        <p>Local CCTV search with scan-first indexing and honest verification status.</p>
      </div>
      <div id="systemStatus" class="status-pill">Loading status...</div>
    </section>

    <section class="workspace">
      <form id="scanForm" class="panel">
        <h2>Scan Video</h2>
        <label for="sampleSelect">Sample asset</label>
        <select id="sampleSelect" name="sample"></select>
        <div class="divider">or</div>
        <label for="videoUpload">Upload MP4</label>
        <input id="videoUpload" name="video" type="file" accept="video/mp4">
        <button id="scanButton" type="submit">Scan video</button>
        <div id="scanStatus" class="message">Choose a video to begin.</div>
      </form>

      <section class="panel">
        <h2>Search</h2>
        <label for="queryInput">Query</label>
        <div class="search-row">
          <input id="queryInput" type="text" placeholder="person, white car, umbrella, backpack">
          <button id="queryButton" type="button" onclick="window.visionGuardFind && window.visionGuardFind()">Find matches</button>
        </div>
        <div id="verificationStatus" class="verification">Verification status will appear after scanning.</div>
        <div id="queryStatus" class="message"></div>
      </section>
    </section>

    <section class="panel results-panel">
      <div class="results-head">
        <h2>Results</h2>
        <button id="exportButton" type="button" onclick="window.visionGuardExport && window.visionGuardExport()">Export selected</button>
      </div>
      <div id="resultsList" class="results-list empty">No matches yet.</div>
      <div id="exportStatus" class="message"></div>
      <div id="downloadList" class="downloads"></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
