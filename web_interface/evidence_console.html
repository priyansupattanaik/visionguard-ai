<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VisionGuard Evidence Console</title>
  <style>
    :root{color-scheme:dark;--ink:#e8efe9;--muted:#9aa9a0;--panel:#121a17;--line:#26342d;--accent:#79e6ad;--danger:#ff9c8f}
    *{box-sizing:border-box}body{margin:0;background:#09100d;color:var(--ink);font:16px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
    main{max-width:960px;margin:auto;padding:5rem 1.25rem}.eyebrow{color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
    h1{font:600 clamp(2.5rem,7vw,5.5rem)/.95 Georgia,serif;margin:.4rem 0 1.5rem;max-width:12ch}p{color:var(--muted);max-width:68ch}
    section{margin-top:3rem;border:1px solid var(--line);background:var(--panel);padding:1.25rem;border-radius:4px}
    label{display:block;margin-bottom:.5rem}input,button{font:inherit}input{width:100%;padding:.9rem;background:#09100d;border:1px solid var(--line);color:var(--ink)}
    button{margin-top:1rem;padding:.8rem 1rem;background:var(--accent);border:0;color:#07110c;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
    pre{white-space:pre-wrap;color:var(--muted);min-height:5rem}.verified{color:var(--accent)}.unverified{color:var(--danger)}
  </style>
</head>
<body><main>
  <div class="eyebrow">Evidence console / v2</div>
  <h1>The video is the record.</h1>
  <p>This console shows grounded answers only. A claim without frame, track, event, or timestamp evidence is returned as unverified.</p>
  <section>
    <form id="queryForm">
      <label for="videoId">Indexed video ID</label><input id="videoId" required autocomplete="off">
      <label for="question" style="margin-top:1rem">Question</label><input id="question" required autocomplete="off" placeholder="What happened after the man entered?">
      <button>Retrieve and verify</button>
    </form>
    <pre id="result" aria-live="polite">Awaiting a query.</pre>
  </section>
</main><script>
const form=document.querySelector('#queryForm'),result=document.querySelector('#result');
form.addEventListener('submit',async(event)=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;result.textContent='Retrieving evidence…';
try{const video=encodeURIComponent(document.querySelector('#videoId').value.trim());const query=document.querySelector('#question').value.trim();
const response=await fetch(`/v1/videos/${video}/query`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Request failed');
result.className=data.verified?'verified':'unverified';result.textContent=JSON.stringify(data,null,2);}catch(error){result.className='unverified';result.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
